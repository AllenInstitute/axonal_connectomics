[project]
name = "acpreprocessing"
description='Axonal connectomics processing'
requires-python = ">3.8,<3.12"
version = "0.0.1"
dynamic = ["dependencies"] 

[tool.setuptools.dynamic]
dependencies = { file = ["pixi_requirements.txt"] }

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-mock",
    "pytest-cov",
    "codecov",
]

[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "acpreprocessing",
]

[tool.setuptools_scm]
version_file = "acpreprocessing/_version.py"

# some downgrades from pixi's expectations
[tool.pixi.system-requirements]
linux = "5.0.0"
libc = "2.27"

[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
acpreprocessing = { path = ".", editable = true }

# conda-enabled features
[tool.pixi.feature.pixi-base.dependencies]
matplotlib = "*"
z5py = "*"

# version-specific python features
[tool.pixi.feature.py310.dependencies]
python = "3.10.*"
numpy = "*"

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"
s3fs = "2025.3.2"
numpy = "*"
zarr = "3.0.6"

[tool.pixi.feature.conda-lab.dependencies]
jupyterlab = "*"

[tool.pixi.feature.scalene.dependencies]
scalene = "*"

[tool.pixi.environments]
py310-conda = ["pixi-base", "py310"]
py311-conda = ["pixi-base", "py311"]
#py311-conda-lab = ["pixi-base", "py311", "conda-lab"]
py310-conda-scalene = ["pixi-base", "py310", "scalene"]
py311-conda-scalene = ["pixi-base", "py311", "scalene"]
#py311-conda-scalene-lab = ["pixi-base", "py311", "scalene", "conda-lab"]


[tool.coverage.run]
omit = ["test/*",]

[tool.pixi.feature.test.tasks]
test = "pytest  --cov --cov-report=xml --junitxml=test-reports/test.xml"